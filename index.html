<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>思维导图编辑器</title>
        <link type="text/css" rel="stylesheet" href="vendor/jsmind.css" />
        <link type="text/css" rel="stylesheet" href="style.css" />

        <!-- jsMind 核心库 -->
        <script type="text/javascript" src="vendor/jsmind.js"></script>
        <!-- 截图插件依赖 -->
        <script type="text/javascript" src="vendor/dom-to-image.min.js"></script>
        <!-- 截图（导出图片）插件 -->
        <script type="text/javascript" src="vendor/jsmind.screenshot.js"></script>
        <!-- 节点拖拽插件 -->
        <script type="text/javascript" src="vendor/jsmind.draggable-node.js"></script>
        <!-- 导出 PDF 依赖 -->
        <script type="text/javascript" src="vendor/jspdf.umd.min.js"></script>
    </head>
    <body>
        <header class="app-header">
            <span class="app-title">🧠 思维导图编辑器</span>
            <input
                id="mind-title"
                class="mind-title"
                type="text"
                value="我的思维导图"
                title="导图名称（用于导出文件名）"
            />
        </header>

        <!-- 菜单分类控制栏 -->
        <div class="menu-bar">
            <div class="menu-nav" id="menu-nav">
                <span class="menu-bar-label">菜单显示：</span>
                <div class="menu-nav-item" data-category="file">
                    <button class="menu-nav-btn active" data-category="file" title="点击切换显示/隐藏文件菜单">
                        <span class="nav-indicator">✓</span> 📁 文件
                    </button>
                    <div class="order-btn-group">
                        <button class="btn-move-menu" data-dir="left" data-category="file" title="左移文件菜单">◀</button>
                        <button class="btn-move-menu" data-dir="right" data-category="file" title="右移文件菜单">▶</button>
                    </div>
                </div>
                <div class="menu-nav-item" data-category="edit">
                    <button class="menu-nav-btn active" data-category="edit" title="点击切换显示/隐藏编辑菜单">
                        <span class="nav-indicator">✓</span> ✏️ 编辑
                    </button>
                    <div class="order-btn-group">
                        <button class="btn-move-menu" data-dir="left" data-category="edit" title="左移编辑菜单">◀</button>
                        <button class="btn-move-menu" data-dir="right" data-category="edit" title="右移编辑菜单">▶</button>
                    </div>
                </div>
                <div class="menu-nav-item" data-category="element">
                    <button class="menu-nav-btn active" data-category="element" title="点击切换显示/隐藏元素菜单">
                        <span class="nav-indicator">✓</span> 🧩 元素
                    </button>
                    <div class="order-btn-group">
                        <button class="btn-move-menu" data-dir="left" data-category="element" title="左移元素菜单">◀</button>
                        <button class="btn-move-menu" data-dir="right" data-category="element" title="右移元素菜单">▶</button>
                    </div>
                </div>
                <div class="menu-nav-item" data-category="view">
                    <button class="menu-nav-btn active" data-category="view" title="点击切换显示/隐藏视图菜单">
                        <span class="nav-indicator">✓</span> 👁️ 视图
                    </button>
                    <div class="order-btn-group">
                        <button class="btn-move-menu" data-dir="left" data-category="view" title="左移视图菜单">◀</button>
                        <button class="btn-move-menu" data-dir="right" data-category="view" title="右移视图菜单">▶</button>
                    </div>
                </div>
            </div>
            <div class="menu-actions">
                <button id="btn-toggle-all-menus" class="menu-action-btn" title="显示或隐藏全部菜单">全部收起</button>
                <span id="status" class="status"></span>
            </div>
        </div>

        <nav class="toolbar" id="toolbar">
            <!-- 1. 文件菜单 -->
            <div class="menu-category" id="menu-cat-file" data-category="file">
                <div class="category-header">
                    <span class="category-drag-handle" title="按住拖拽调整顺序">⋮⋮</span>
                    <span class="category-title">📁 文件</span>
                    <button class="btn-cat-move" data-dir="left" data-category="file" title="左移文件菜单">◀</button>
                    <button class="btn-cat-move" data-dir="right" data-category="file" title="右移文件菜单">▶</button>
                    <button class="category-close-btn" data-category="file" title="隐藏文件菜单">✕</button>
                </div>
                <div class="category-body">
                    <button id="btn-new" title="新建思维导图">📄 新建</button>
                    <button id="btn-open" title="打开思维导图文件">📂 打开</button>
                    <button id="btn-save" title="保存思维导图文件">💾 保存</button>
                    <button id="btn-export-png" title="导出为 PNG 图片">🖼️ 图片</button>
                    <button id="btn-export-pdf" title="导出为 PDF 文档">📄 PDF</button>
                    <button id="btn-export-word" title="导出为 Word 文档">📝 Word</button>
                </div>
            </div>

            <!-- 2. 编辑菜单 -->
            <div class="menu-category" id="menu-cat-edit" data-category="edit">
                <div class="category-header">
                    <span class="category-drag-handle" title="按住拖拽调整顺序">⋮⋮</span>
                    <span class="category-title">✏️ 编辑</span>
                    <button class="btn-cat-move" data-dir="left" data-category="edit" title="左移编辑菜单">◀</button>
                    <button class="btn-cat-move" data-dir="right" data-category="edit" title="右移编辑菜单">▶</button>
                    <button class="category-close-btn" data-category="edit" title="隐藏编辑菜单">✕</button>
                </div>
                <div class="category-body">
                    <button id="btn-undo" title="撤销（Ctrl+Z）">↩️ 撤销</button>
                    <button id="btn-redo" title="重做（Ctrl+Y）">↪️ 重做</button>
                    <button id="btn-mode-select" class="mode-btn active" title="选择/编辑节点">🖱️ 选择</button>
                    <button id="btn-mode-edge" class="mode-btn" title="连线模式：点击源节点，再点击目标节点">➡️ 连线</button>
                    <div class="tool-group-inline" id="edge-type-group" title="流程连线类型">
                        <span class="tool-label">连线</span>
                        <select id="edge-type" title="选择连线类型">
                            <option value="arrow">→ 有向箭头</option>
                            <option value="line">— 直线</option>
                            <option value="loop">↻ 循环/自环</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 3. 元素菜单 -->
            <div class="menu-category" id="menu-cat-element" data-category="element">
                <div class="category-header">
                    <span class="category-drag-handle" title="按住拖拽调整顺序">⋮⋮</span>
                    <span class="category-title">🧩 元素</span>
                    <button class="btn-cat-move" data-dir="left" data-category="element" title="左移元素菜单">◀</button>
                    <button class="btn-cat-move" data-dir="right" data-category="element" title="右移元素菜单">▶</button>
                    <button class="category-close-btn" data-category="element" title="隐藏元素菜单">✕</button>
                </div>
                <div class="category-body">
                    <button id="btn-add-brother" title="添加同级节点（快捷键 Enter）">↔️ 同级节点</button>
                    <button id="btn-add-child" title="添加子节点（快捷键 Insert）">➕ 子节点</button>
                    <button id="btn-add-floating" title="添加独立节点（不挂在树下），可自由拖动并用连线连接">⭕ 独立节点</button>
                    <button id="btn-add-junction" title="添加分支/汇合接头节点">◈ 接头节点</button>
                    <button id="btn-edit" title="快捷键 F2，或双击节点">✏️ 编辑</button>
                    <button id="btn-remove" title="快捷键 Delete">🗑️ 删除</button>
                </div>
            </div>

            <!-- 4. 视图菜单 -->
            <div class="menu-category" id="menu-cat-view" data-category="view">
                <div class="category-header">
                    <span class="category-drag-handle" title="按住拖拽调整顺序">⋮⋮</span>
                    <span class="category-title">👁️ 视图</span>
                    <button class="btn-cat-move" data-dir="left" data-category="view" title="左移视图菜单">◀</button>
                    <button class="btn-cat-move" data-dir="right" data-category="view" title="右移视图菜单">▶</button>
                    <button class="category-close-btn" data-category="view" title="隐藏视图菜单">✕</button>
                </div>
                <div class="category-body">
                    <button id="btn-toggle-outline" title="显示/隐藏大纲结构">📋 大纲</button>
                    <button id="btn-toggle-inspector" title="显示/隐藏节点属性面板">🎛️ 属性</button>
                    <button id="btn-zoom-in" title="放大">🔍 放大</button>
                    <button id="btn-zoom-out" title="缩小">🔎 缩小</button>
                    <button id="btn-expand-all" title="展开所有节点">📖 展开</button>
                    <button id="btn-collapse-all" title="收起所有节点">📕 收起</button>
                    <button id="btn-auto-layout" title="重新自动排版，防止节点重叠">🧩 排版</button>
                </div>
            </div>
            <div id="toolbar-empty-hint" class="toolbar-empty-hint" style="display: none;">已隐藏全部菜单类别，点击上方栏目按钮即可重新显示</div>
        </nav>

        <div class="main">
            <!-- 左侧大纲结构面板 -->
            <aside id="sidebar" class="sidebar">
                <div class="sidebar-header">
                    <span>📋 大纲结构</span>
                    <span class="hint">拖拽排序 · Tab降级/Shift+Tab升级</span>
                </div>
                <!-- 大纲快捷工具条 -->
                <div class="outline-toolbar">
                    <button id="outline-btn-add-child" class="outline-tool-btn" title="添加子节点（Insert）">➕</button>
                    <button id="outline-btn-add-brother" class="outline-tool-btn" title="添加同级节点（Enter）">↔️</button>
                    <button id="outline-btn-move-up" class="outline-tool-btn" title="上移同级顺序（Alt+↑）">⬆️</button>
                    <button id="outline-btn-move-down" class="outline-tool-btn" title="下移同级顺序（Alt+↓）">⬇️</button>
                    <button id="outline-btn-promote" class="outline-tool-btn" title="升级：提升为父级同级（Shift+Tab）">⇤</button>
                    <button id="outline-btn-demote" class="outline-tool-btn" title="降级：成为上方节点的子节点（Tab）">⇥</button>
                    <button id="outline-btn-delete" class="outline-tool-btn danger" title="删除选中节点（Delete）">🗑️</button>
                </div>
                <div id="outline" class="outline"></div>
            </aside>
            <!-- 思维导图容器 -->
            <div id="jsmind_container"></div>
            <!-- 右侧节点属性面板 -->
            <aside id="inspector" class="inspector">
                <div class="inspector-header">
                    <span id="inspector-title">🎛️ 节点属性</span>
                    <span id="inspector-node-topic" class="inspector-topic">未选中节点</span>
                </div>
                <!-- 节点属性区 -->
                <div id="inspector-body" class="inspector-body disabled">
                    <div class="field">
                        <label>节点大小（宽 × 高，px，留空为自适应）</label>
                        <div class="size-row">
                            <input id="node-width" type="number" min="0" placeholder="宽" />
                            <span>×</span>
                            <input id="node-height" type="number" min="0" placeholder="高" />
                            <button id="btn-apply-size">应用</button>
                        </div>
                    </div>
                    <div class="field">
                        <label>外框形状</label>
                        <div id="shape-group" class="shape-group">
                            <button data-shape="default" class="shape-btn">默认</button>
                            <button data-shape="rect" class="shape-btn">▭ 方形</button>
                            <button data-shape="rounded" class="shape-btn">▢ 圆角</button>
                            <button data-shape="pill" class="shape-btn">💊 胶囊</button>
                            <button data-shape="circle" class="shape-btn">⭕ 圆形</button>
                            <button data-shape="diamond" class="shape-btn">💠 菱形</button>
                            <button data-shape="triangle" class="shape-btn">🔺 三角</button>
                            <button data-shape="underline" class="shape-btn">▁ 底线</button>
                        </div>
                    </div>
                    <div class="field">
                        <label>插入表情 / 图片 / 手绘</label>
                        <div class="field-btn-row">
                            <button id="btn-emoji" title="插入 Emoji 表情图标">😀 表情</button>
                            <button id="btn-insert-image" title="选择并插入本地图片">🖼️ 图片</button>
                            <button id="btn-handwriting" title="打开手写涂鸦板并绘制后插入节点">✍️ 手写</button>
                        </div>
                        <div class="field-btn-row" style="margin-top: 4px;">
                            <button id="btn-remove-image" class="danger hidden">移除图片/手绘</button>
                        </div>
                    </div>
                    <div class="field">
                        <label>背景色 / 文字色</label>
                        <div class="size-row">
                            <input id="node-bgcolor" type="color" value="#ffffff" title="背景色" />
                            <input id="node-fgcolor" type="color" value="#000000" title="文字色" />
                            <button id="btn-apply-color">应用</button>
                        </div>
                    </div>
                    <div class="field">
                        <label>文字对齐</label>
                        <div class="align-row">
                            <span class="align-label">水平</span>
                            <div id="halign-group" class="shape-group">
                                <button data-align="left" class="shape-btn">⯇ 左</button>
                                <button data-align="center" class="shape-btn">↔ 居中</button>
                                <button data-align="right" class="shape-btn">⯈ 右</button>
                            </div>
                        </div>
                        <div class="align-row">
                            <span class="align-label">垂直</span>
                            <div id="valign-group" class="shape-group">
                                <button data-align="top" class="shape-btn">⤒ 上</button>
                                <button data-align="middle" class="shape-btn">↕ 居中</button>
                                <button data-align="bottom" class="shape-btn">⤓ 下</button>
                            </div>
                        </div>
                    </div>
                    <div class="field">
                        <label>换行方式</label>
                        <div id="wrap-group" class="shape-group">
                            <button data-wrap="auto" class="shape-btn">自动换行</button>
                            <button data-wrap="manual" class="shape-btn">手动换行</button>
                        </div>
                        <p class="field-hint">手动换行时，编辑节点文本中输入的换行会被保留</p>
                    </div>
                </div>
                <!-- 页面属性区（点击空白处时显示） -->
                <div id="page-props" class="inspector-body hidden">
                    <div class="field">
                        <label>导图名称</label>
                        <div class="size-row">
                            <input id="page-name" type="text" placeholder="导图名称" style="flex:1" />
                        </div>
                    </div>
                    <div class="field">
                        <label>画布尺寸（宽 × 高，px，留空为自适应）</label>
                        <div class="size-row">
                            <input id="page-width" type="number" min="0" placeholder="宽" />
                            <span>×</span>
                            <input id="page-height" type="number" min="0" placeholder="高" />
                            <button id="btn-apply-page-size">应用</button>
                        </div>
                        <p class="field-hint">调整导图内容区域的最小尺寸</p>
                    </div>
                    <div class="field">
                        <label>页面背景色</label>
                        <div class="size-row">
                            <input id="page-bgcolor" type="color" value="#f4f4f4" title="背景色" />
                            <button id="btn-apply-page-bg">应用</button>
                        </div>
                    </div>
                    <div class="field">
                        <label>导出图片/PDF 背景色</label>
                        <div class="size-row">
                            <input id="export-bgcolor" type="color" value="#ffffff" title="导出背景色" />
                            <button id="btn-apply-export-bg">应用</button>
                        </div>
                        <p class="field-hint">导出 PNG/PDF 时的底色</p>
                    </div>
                </div>
            </aside>
        </div>

        <!-- 画布右键菜单 -->
        <div id="ctx-menu" class="ctx-menu hidden">
            <button data-cmd="auto-layout">🧩 自动排版</button>
            <button data-cmd="add-child">➕ 添加子节点</button>
            <button data-cmd="add-brother">↔️ 添加同级节点</button>
            <button data-cmd="add-edge">➡️ 连接到…</button>
            <button data-cmd="add-loop">↻ 自环</button>
            <button data-cmd="to-child" id="ctx-to-child">🌳 转为子节点</button>
            <button data-cmd="expand">📖 展开</button>
            <button data-cmd="collapse">📕 收起</button>
            <button data-cmd="edit">✏️ 编辑节点</button>
            <button data-cmd="remove" class="danger">🗑️ 删除节点</button>
        </div>

        <!-- 选中连线时的操作面板 -->
        <div id="edge-panel" class="edge-panel hidden">
            <span class="edge-panel-title">连线</span>
            <select id="edge-panel-type" title="连线类型">
                <option value="arrow">→ 箭头</option>
                <option value="line">— 直线</option>
                <option value="loop">↻ 循环</option>
            </select>
            <select id="edge-panel-shape" title="连线形状">
                <option value="curve">〜 曲线</option>
                <option value="straight">— 直线</option>
                <option value="elbow">┐ 肘形</option>
            </select>
            <select id="edge-panel-elbow-dir" title="肘形转弯方向" style="display: none;">
                <option value="auto">⚡ 自动转弯</option>
                <option value="horizontal">↔ 先横后竖</option>
                <option value="vertical">↕ 先竖后横</option>
            </select>
            <label class="edge-bend-label" title="弧度（曲线时有效，负值反向）">
                弧度
                <input id="edge-panel-bend" type="range" min="-100" max="100" value="15" />
            </label>
            <label class="edge-width-label" title="线条粗细">
                粗细
                <input id="edge-panel-width" type="range" min="1" max="10" value="2" />
                <span id="edge-panel-width-val" class="edge-width-val">2px</span>
            </label>
            <input id="edge-panel-color" type="color" value="#c0392b" title="连线颜色" />
            <button id="edge-panel-delete" class="op-btn danger" title="删除连线">✕</button>
        </div>

        <!-- 表情选择面板 -->
        <div id="emoji-panel" class="emoji-panel hidden">
            <div class="emoji-header">
                <span>选择表情图标</span>
                <button id="emoji-close" class="op-btn">✕</button>
            </div>
            <div id="emoji-tabs" class="emoji-tabs"></div>
            <div id="emoji-grid" class="emoji-grid"></div>
        </div>

        <!-- 手写绘制窗口 -->
        <div id="handwriting-modal" class="hw-modal hidden">
            <div class="hw-modal-mask"></div>
            <div class="hw-modal-content">
                <div class="hw-header">
                    <span class="hw-title">✍️ 手写绘制</span>
                    <button id="hw-close" class="op-btn" title="关闭窗口">✕</button>
                </div>
                <div class="hw-toolbar">
                    <div class="hw-tool-item">
                        <label for="hw-color">线条颜色：</label>
                        <input id="hw-color" type="color" value="#2c3e50" title="调节线条颜色" />
                        <div class="hw-color-presets">
                            <span class="hw-color-preset" style="background:#2c3e50" data-color="#2c3e50" title="黑蓝"></span>
                            <span class="hw-color-preset" style="background:#e74c3c" data-color="#e74c3c" title="红"></span>
                            <span class="hw-color-preset" style="background:#27ae60" data-color="#27ae60" title="绿"></span>
                            <span class="hw-color-preset" style="background:#2980b9" data-color="#2980b9" title="蓝"></span>
                            <span class="hw-color-preset" style="background:#f39c12" data-color="#f39c12" title="橙"></span>
                            <span class="hw-color-preset" style="background:#8e44ad" data-color="#8e44ad" title="紫"></span>
                        </div>
                    </div>
                    <div class="hw-tool-item">
                        <label for="hw-size">粗细：</label>
                        <input id="hw-size" type="range" min="1" max="12" value="3" title="线条粗细" />
                        <span id="hw-size-label" class="hw-size-val">3px</span>
                    </div>
                    <div class="hw-tool-item">
                        <button id="hw-tool-pen" class="hw-btn active">✏️ 画笔</button>
                        <button id="hw-tool-eraser" class="hw-btn">🧹 橡皮</button>
                        <button id="hw-clear" class="hw-btn">🗑️ 清空</button>
                    </div>
                </div>
                <div class="hw-canvas-container">
                    <canvas id="hw-canvas" width="460" height="260"></canvas>
                </div>
                <div class="hw-footer">
                    <span class="hw-tip">在画板上自由手写签名、标注或涂鸦</span>
                    <div class="hw-actions">
                        <button id="hw-cancel" class="hw-btn">取消</button>
                        <button id="hw-confirm" class="hw-btn primary">插入到节点</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 隐藏的图片选择器 -->
        <input id="image-input" type="file" accept="image/*" style="display: none" />

        <!-- 隐藏的文件选择器，用于打开本地 .jm / .json / .hxmp 文件 -->
        <input
            id="file-input"
            type="file"
            accept=".jm,.json,.hxmp,application/json"
            style="display: none"
        />

        <!-- 保存格式选择对话框（明文 .jm / 加密 .hxmp） -->
        <div id="save-dialog" class="modal-mask hidden">
            <div class="modal-box">
                <div class="modal-title">保存导图</div>
                <div class="modal-body">
                    <label class="radio-row">
                        <input type="radio" name="save-format" value="plain" checked />
                        明文保存（.jm）
                    </label>
                    <label class="radio-row">
                        <input type="radio" name="save-format" value="encrypted" />
                        加密保存（.hxmp）
                    </label>
                    <div id="save-password-row" class="password-row hidden">
                        <input id="save-password" type="password" placeholder="设置加密密码" autocomplete="new-password" />
                        <input id="save-password2" type="password" placeholder="确认密码" autocomplete="new-password" />
                    </div>
                    <div id="save-error" class="modal-error hidden"></div>
                </div>
                <div class="modal-actions">
                    <button id="save-cancel" class="op-btn">取消</button>
                    <button id="save-confirm" class="op-btn primary">保存</button>
                </div>
            </div>
        </div>

        <!-- 打开加密文件时的解密密码对话框 -->
        <div id="decrypt-dialog" class="modal-mask hidden">
            <div class="modal-box">
                <div class="modal-title">🔒 解密文件</div>
                <div class="modal-body">
                    <p class="modal-hint">该文件已加密，请输入密码解密</p>
                    <input id="decrypt-password" type="password" placeholder="输入密码" autocomplete="current-password" />
                    <div id="decrypt-error" class="modal-error hidden"></div>
                </div>
                <div class="modal-actions">
                    <button id="decrypt-cancel" class="op-btn">取消</button>
                    <button id="decrypt-confirm" class="op-btn primary">解密打开</button>
                </div>
            </div>
        </div>

        <script type="text/javascript" src="app.js"></script>
    </body>
</html>
