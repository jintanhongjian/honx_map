<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>思维导图编辑器</title>
        <link type="text/css" rel="stylesheet" href="vendor/jsmind.css" />
        <link type="text/css" rel="stylesheet" href="style.css" />

        <!-- jsMind 核心库 -->
        <script type="text/javascript" src="vendor/jsmind.js"></script>
        <!-- 截图插件依赖 -->
        <script type="text/javascript" src="vendor/dom-to-image.min.js"></script>
        <!-- 截图（导出图片）插件 -->
        <script type="text/javascript" src="vendor/jsmind.screenshot.js"></script>
        <!-- 节点拖拽插件 -->
        <script type="text/javascript" src="vendor/jsmind.draggable-node.js"></script>
        <!-- 导出 PDF 依赖 -->
        <script type="text/javascript" src="vendor/jspdf.umd.min.js"></script>
    </head>
    <body>
        <header class="app-header">
            <span class="app-title">🧠 思维导图编辑器</span>
            <input
                id="mind-title"
                class="mind-title"
                type="text"
                value="我的思维导图"
                title="导图名称（用于导出文件名）"
            />
        </header>

        <nav class="toolbar">
            <!-- 面板与历史 -->
            <div class="tool-group" title="面板与编辑历史">
                <button id="btn-toggle-outline" title="显示/隐藏大纲结构">📋 大纲</button>
                <button id="btn-toggle-inspector" title="显示/隐藏节点属性面板">🎛️ 属性</button>
                <button id="btn-undo" title="撤销（Ctrl+Z）">↩️ 撤销</button>
                <button id="btn-redo" title="重做（Ctrl+Y）">↪️ 重做</button>
            </div>
            <!-- 模式 -->
            <div class="tool-group" title="交互模式">
                <button id="btn-mode-select" class="mode-btn active" title="选择/编辑节点">🖱️ 选择</button>
                <button id="btn-mode-edge" class="mode-btn" title="连线模式：点击源节点，再点击目标节点">➡️ 连线</button>
            </div>
            <!-- 节点 -->
            <div class="tool-group" title="节点操作">
                <button id="btn-add-child" title="快捷键 Insert">➕ 子节点</button>
                <button id="btn-add-brother" title="快捷键 Enter">↔️ 同级节点</button>
                <button id="btn-add-floating" title="添加独立节点（不挂在树下），可自由拖动并用连线连接">⭕ 独立节点</button>
                <button id="btn-add-junction" title="添加分支/汇合接头节点">◈ 接头节点</button>
                <button id="btn-edit" title="快捷键 F2，或双击节点">✏️ 编辑</button>
                <button id="btn-remove" title="快捷键 Delete">🗑️ 删除</button>
            </div>
            <!-- 连线 -->
            <div class="tool-group" id="edge-type-group" title="流程连线">
                <span class="tool-label">连线</span>
                <select id="edge-type">
                    <option value="arrow">→ 有向箭头</option>
                    <option value="line">— 直线</option>
                    <option value="loop">↻ 循环/自环</option>
                </select>
            </div>
            <!-- 视图 -->
            <div class="tool-group" title="视图">
                <button id="btn-zoom-in">🔍 放大</button>
                <button id="btn-zoom-out">🔎 缩小</button>
                <button id="btn-expand-all">📖 展开</button>
                <button id="btn-collapse-all">📕 收起</button>
                <button id="btn-auto-layout" title="重新自动排版，防止节点重叠">🧩 排版</button>
            </div>
            <!-- 文件 -->
            <div class="tool-group" title="文件">
                <button id="btn-new">📄 新建</button>
                <button id="btn-open">📂 打开</button>
                <button id="btn-save">💾 保存</button>
            </div>
            <!-- 导出 -->
            <div class="tool-group" title="导出">
                <button id="btn-export-png">🖼️ 图片</button>
                <button id="btn-export-pdf">📄 PDF</button>
                <button id="btn-export-word">📝 Word</button>
            </div>
            <span id="status" class="status"></span>
        </nav>

        <div class="main">
            <!-- 左侧大纲结构面板 -->
            <aside id="sidebar" class="sidebar">
                <div class="sidebar-header">
                    <span>📋 大纲结构</span>
                    <span class="hint">Tab 降级 · Shift+Tab 升级 · 双击重命名</span>
                </div>
                <div id="outline" class="outline"></div>
            </aside>
            <!-- 思维导图容器 -->
            <div id="jsmind_container"></div>
            <!-- 右侧节点属性面板 -->
            <aside id="inspector" class="inspector">
                <div class="inspector-header">
                    <span id="inspector-title">🎛️ 节点属性</span>
                    <span id="inspector-node-topic" class="inspector-topic">未选中节点</span>
                </div>
                <!-- 节点属性区 -->
                <div id="inspector-body" class="inspector-body disabled">
                    <div class="field">
                        <label>节点大小（宽 × 高，px，留空为自适应）</label>
                        <div class="size-row">
                            <input id="node-width" type="number" min="0" placeholder="宽" />
                            <span>×</span>
                            <input id="node-height" type="number" min="0" placeholder="高" />
                            <button id="btn-apply-size">应用</button>
                        </div>
                    </div>
                    <div class="field">
                        <label>外框形状</label>
                        <div id="shape-group" class="shape-group">
                            <button data-shape="default" class="shape-btn">默认</button>
                            <button data-shape="rect" class="shape-btn">▭ 方形</button>
                            <button data-shape="rounded" class="shape-btn">▢ 圆角</button>
                            <button data-shape="pill" class="shape-btn">💊 胶囊</button>
                            <button data-shape="circle" class="shape-btn">⭕ 圆形</button>
                            <button data-shape="diamond" class="shape-btn">💠 菱形</button>
                            <button data-shape="triangle" class="shape-btn">🔺 三角</button>
                            <button data-shape="underline" class="shape-btn">▁ 底线</button>
                        </div>
                    </div>
                    <div class="field">
                        <label>插入表情图标</label>
                        <button id="btn-emoji">😀 打开表情库…</button>
                    </div>
                    <div class="field">
                        <label>插入用户图片</label>
                        <button id="btn-insert-image">🖼️ 选择图片…</button>
                        <button id="btn-remove-image" class="danger hidden">移除图片</button>
                    </div>
                    <div class="field">
                        <label>背景色 / 文字色</label>
                        <div class="size-row">
                            <input id="node-bgcolor" type="color" value="#ffffff" title="背景色" />
                            <input id="node-fgcolor" type="color" value="#000000" title="文字色" />
                            <button id="btn-apply-color">应用</button>
                        </div>
                    </div>
                    <div class="field">
                        <label>文字对齐</label>
                        <div class="align-row">
                            <span class="align-label">水平</span>
                            <div id="halign-group" class="shape-group">
                                <button data-align="left" class="shape-btn">⯇ 左</button>
                                <button data-align="center" class="shape-btn">↔ 居中</button>
                                <button data-align="right" class="shape-btn">⯈ 右</button>
                            </div>
                        </div>
                        <div class="align-row">
                            <span class="align-label">垂直</span>
                            <div id="valign-group" class="shape-group">
                                <button data-align="top" class="shape-btn">⤒ 上</button>
                                <button data-align="middle" class="shape-btn">↕ 居中</button>
                                <button data-align="bottom" class="shape-btn">⤓ 下</button>
                            </div>
                        </div>
                    </div>
                    <div class="field">
                        <label>换行方式</label>
                        <div id="wrap-group" class="shape-group">
                            <button data-wrap="auto" class="shape-btn">自动换行</button>
                            <button data-wrap="manual" class="shape-btn">手动换行</button>
                        </div>
                        <p class="field-hint">手动换行时，编辑节点文本中输入的换行会被保留</p>
                    </div>
                </div>
                <!-- 页面属性区（点击空白处时显示） -->
                <div id="page-props" class="inspector-body hidden">
                    <div class="field">
                        <label>导图名称</label>
                        <div class="size-row">
                            <input id="page-name" type="text" placeholder="导图名称" style="flex:1" />
                        </div>
                    </div>
                    <div class="field">
                        <label>画布尺寸（宽 × 高，px，留空为自适应）</label>
                        <div class="size-row">
                            <input id="page-width" type="number" min="0" placeholder="宽" />
                            <span>×</span>
                            <input id="page-height" type="number" min="0" placeholder="高" />
                            <button id="btn-apply-page-size">应用</button>
                        </div>
                        <p class="field-hint">调整导图内容区域的最小尺寸</p>
                    </div>
                    <div class="field">
                        <label>页面背景色</label>
                        <div class="size-row">
                            <input id="page-bgcolor" type="color" value="#f4f4f4" title="背景色" />
                            <button id="btn-apply-page-bg">应用</button>
                        </div>
                    </div>
                    <div class="field">
                        <label>导出图片/PDF 背景色</label>
                        <div class="size-row">
                            <input id="export-bgcolor" type="color" value="#ffffff" title="导出背景色" />
                            <button id="btn-apply-export-bg">应用</button>
                        </div>
                        <p class="field-hint">导出 PNG/PDF 时的底色</p>
                    </div>
                </div>
            </aside>
        </div>

        <!-- 画布右键菜单 -->
        <div id="ctx-menu" class="ctx-menu hidden">
            <button data-cmd="auto-layout">🧩 自动排版</button>
            <button data-cmd="add-child">➕ 添加子节点</button>
            <button data-cmd="add-brother">↔️ 添加同级节点</button>
            <button data-cmd="add-edge">➡️ 连接到…</button>
            <button data-cmd="add-loop">↻ 自环</button>
            <button data-cmd="to-child" id="ctx-to-child">🌳 转为子节点</button>
            <button data-cmd="expand">📖 展开</button>
            <button data-cmd="collapse">📕 收起</button>
            <button data-cmd="edit">✏️ 编辑节点</button>
            <button data-cmd="remove" class="danger">🗑️ 删除节点</button>
        </div>

        <!-- 选中连线时的操作面板 -->
        <div id="edge-panel" class="edge-panel hidden">
            <span class="edge-panel-title">连线</span>
            <select id="edge-panel-type" title="连线类型">
                <option value="arrow">→ 箭头</option>
                <option value="line">— 直线</option>
                <option value="loop">↻ 循环</option>
            </select>
            <select id="edge-panel-shape" title="连线形状">
                <option value="curve">〜 曲线</option>
                <option value="straight">— 直线</option>
                <option value="elbow">┐ 肘形</option>
            </select>
            <label class="edge-bend-label" title="弧度（曲线时有效，负值反向）">
                弧度
                <input id="edge-panel-bend" type="range" min="-100" max="100" value="15" />
            </label>
            <input id="edge-panel-color" type="color" value="#c0392b" title="连线颜色" />
            <button id="edge-panel-delete" class="op-btn danger" title="删除连线">✕</button>
        </div>

        <!-- 表情选择面板 -->
        <div id="emoji-panel" class="emoji-panel hidden">
            <div class="emoji-header">
                <span>选择表情图标</span>
                <button id="emoji-close" class="op-btn">✕</button>
            </div>
            <div id="emoji-tabs" class="emoji-tabs"></div>
            <div id="emoji-grid" class="emoji-grid"></div>
        </div>

        <!-- 隐藏的图片选择器 -->
        <input id="image-input" type="file" accept="image/*" style="display: none" />

        <!-- 隐藏的文件选择器，用于打开本地 .jm / .json / .hxmp 文件 -->
        <input
            id="file-input"
            type="file"
            accept=".jm,.json,.hxmp,application/json"
            style="display: none"
        />

        <!-- 保存格式选择对话框（明文 .jm / 加密 .hxmp） -->
        <div id="save-dialog" class="modal-mask hidden">
            <div class="modal-box">
                <div class="modal-title">保存导图</div>
                <div class="modal-body">
                    <label class="radio-row">
                        <input type="radio" name="save-format" value="plain" checked />
                        明文保存（.jm）
                    </label>
                    <label class="radio-row">
                        <input type="radio" name="save-format" value="encrypted" />
                        加密保存（.hxmp）
                    </label>
                    <div id="save-password-row" class="password-row hidden">
                        <input id="save-password" type="password" placeholder="设置加密密码" autocomplete="new-password" />
                        <input id="save-password2" type="password" placeholder="确认密码" autocomplete="new-password" />
                    </div>
                    <div id="save-error" class="modal-error hidden"></div>
                </div>
                <div class="modal-actions">
                    <button id="save-cancel" class="op-btn">取消</button>
                    <button id="save-confirm" class="op-btn primary">保存</button>
                </div>
            </div>
        </div>

        <!-- 打开加密文件时的解密密码对话框 -->
        <div id="decrypt-dialog" class="modal-mask hidden">
            <div class="modal-box">
                <div class="modal-title">🔒 解密文件</div>
                <div class="modal-body">
                    <p class="modal-hint">该文件已加密，请输入密码解密</p>
                    <input id="decrypt-password" type="password" placeholder="输入密码" autocomplete="current-password" />
                    <div id="decrypt-error" class="modal-error hidden"></div>
                </div>
                <div class="modal-actions">
                    <button id="decrypt-cancel" class="op-btn">取消</button>
                    <button id="decrypt-confirm" class="op-btn primary">解密打开</button>
                </div>
            </div>
        </div>

        <script type="text/javascript" src="app.js"></script>
    </body>
</html>
